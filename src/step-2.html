<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стажировка — Рога и копыта</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>

    <header class="header">
        <div class="container header__content">

            <div class="header__brand">
                <div class="header__logo-icon">РК</div>
                <div class="header__logo-text">Рога и копыта</div>
            </div>

            <nav class="header__nav">
                <a class="header__nav-item header__nav-item--active">Стажировки</a>
                <a class="header__nav-item">Практика</a>
                <a class="header__nav-item">Амбассадоры в вузе</a>
                <a class="header__nav-item">Обучение</a>
                <a class="header__nav-item">Мероприятия</a>

                <div class="account-icon">
                    <div class="account-icon__inner">
                        <div class="account-icon__head"></div>
                        <div class="account-icon__body"></div>
                    </div>
                </div>
            </nav>

        </div>
    </header>

    <main class="main">
        <div class="container">

            <form class="form" action="step-3.html">

                <div class="form__group">
                    <label class="form__label">На какой ступени образования ты сейчас находишься:</label>
                    <div class="form__radio-group">
                        <label><input type="radio" name="education" value="Среднее профессиональное"> Среднее профессиональное</label>
                        <label><input type="radio" name="education" value="Бакалавриат"> Бакалавриат</label>
                        <label><input type="radio" name="education" value="Магистратура"> Магистратура</label>
                    </div>
                </div>

                <div class="form__group">
                    <label class="form__label">На каком ты курсе:</label>
                    <div class="form__radio-group">
                        <label><input type="radio" name="course" value="1"> 1</label>
                        <label><input type="radio" name="course" value="2"> 2</label>
                        <label><input type="radio" name="course" value="3"> 3</label>
                        <label><input type="radio" name="course" value="4"> 4</label>
                    </div>
                </div>

                <div class="form__group">
                    <label class="form__label">Укажи свой средний балл в формате от 0 до 5 с округлением до десятых:</label>
                    <input class="form__input" type="number" step="0.1" min="0" max="5">
                </div>

                <div class="form__group">
                    <label class="form__label">Расскажи про учебные проекты, в которых ты принимал(а) участие (какая у тебя была роль, что удалось сделать):</label>
                    <textarea class="form__input" rows="4"></textarea>
                </div>

                <div class="form__actions">
                    <button class="button" type="submit">Далее</button>
                </div>

            </form>

        </div>
    </main>

    <footer class="footer">
        <div class="container footer__content">
            <div class="footer-column">
                <a href="#">Мы в Telegram</a>
                <a href="#">Карьера для профессионалов</a>
            </div>
            <div class="footer-column">
                <a href="#">Политика обработки данных</a>
                <a href="#">Политика использования cookies</a>
            </div>
            <div class="footer-column">
                <span>2000—2025, ООО «Рога и копыта», 194100, Санкт-Петербург, ул. Кантемировская, д. 3, корп. 1, лит. А</span>
            </div>
        </div>
    </footer>

</body>
</html>
