<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стажировка — Рога и копыта</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>

    <header class="header">
        <div class="container header__content">

            <div class="header__brand">
                <div class="header__logo-icon">РК</div>
                <div class="header__logo-text">Рога и копыта</div>
            </div>

            <nav class="header__nav">
                <a class="header__nav-item header__nav-item--active">Стажировки</a>
                <a class="header__nav-item">Практика</a>
                <a class="header__nav-item">Амбассадоры в вузе</a>
                <a class="header__nav-item">Обучение</a>
                <a class="header__nav-item">Мероприятия</a>

                <div class="account-icon">
                    <div class="account-icon__inner">
                        <div class="account-icon__head"></div>
                        <div class="account-icon__body"></div>
                    </div>
                </div>
            </nav>

        </div>
    </header>

    <main class="main">
        <div class="container">

            <form class="form" action="step-2.html">
                <h1 class="form__title">Заявка на стажировку</h1>

                <div class="form__group">
                    <label class="form__label">Укажи свое ФИО</label>
                    <input class="form__input" type="text">
                </div>

                <div class="form__group">
                    <label class="form__label">
                        Укажи свой ник в Telegram в формате: @nick
                    </label>
                    <input class="form__input" type="text">
                </div>

                <div class="form__group">
                    <label class="form__label">
                        Укажи позицию, на которую ты претендуешь
                    </label>
                    <select class="form__select">
                        <option>Стажер UX-исследователь</option>
                        <option>Стажер UX/UI дизайнер</option>
                        <option>Стажер Frontend разработчик</option>
                        <option>Стажер Backend разработчик</option>
                    </select>
                </div>

                <div class="form__actions">
                    <button class="button" type="submit">Далее</button>
                </div>
            </form>

        </div>
    </main>

    <footer class="footer">
        <div class="container footer__content">
            <div class="footer-column">
                <a href="#">Мы в Telegram</a>
                <a href="#">Карьера для профессионалов</a>
            </div>
            <div class="footer-column">
                <a href="#">Политика обработки данных</a>
                <a href="#">Политика использования cookies</a>
            </div>
            <div class="footer-column">
                <span>2000—2025, ООО «Рога и копыта», 194100, Санкт-Петербург, ул. Кантемировская, д. 3, корп. 1, лит. А</span>
            </div>
        </div>
    </footer>

</body>
</html>
